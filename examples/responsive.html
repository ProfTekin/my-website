<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive layout demonstration</title><style>body{font:16px system-ui;margin:16px;color:#223047}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cards div{background:#edf2ff;padding:22px;border-radius:7px}@media(max-width:600px){.cards{grid-template-columns:1fr}}</style></head><body><p>Three columns above 600px. One column at 600px or below.</p><div class="cards"><div>Espresso</div><div>Tea</div><div>Pastry</div></div></body></html>
